name: Update PR Stats

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:        # allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch merged PR count
        id: pr_stats
        run: |
          COUNT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/search/issues?q=type:pr+author:aviraltrip+is:merged" \
            | jq '.total_count')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          sed -i "/<!--STATS:START-->/,/<!--STATS:END-->/c\\
          <!--STATS:START-->\\
           **Merged PRs:** ${{ steps.pr_stats.outputs.count }}\\
          <!--STATS:END-->" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update PR stats"
          git push
